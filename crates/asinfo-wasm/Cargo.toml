[package]
name = "archive-viewer-asinfo"
description = "Lazily-loaded ASN name lookup for the archive viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Embeds the whole ipverse/as-metadata table at compile time (~4 MB). That is
# why this is its own module: the viewer loads it only when the networks view
# is opened, instead of carrying it in the main bundle.
asinfo.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.121"
