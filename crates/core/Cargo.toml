[package]
name = "archive-viewer-core"
description = "Decoding and aggregation of peer-observer archive files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
asmap.workspace = true
prost.workspace = true
prost-reflect.workspace = true
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
prost-build.workspace = true

# Only used to *write* archive fixtures in tests, which are native-only; the C
# zstd library does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zstd = "0.13"
