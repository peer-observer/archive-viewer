[package]
name = "archive-viewer-wasm"
description = "wasm-bindgen bindings for the peer-observer archive viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
archive-viewer-core.workspace = true
asmap.workspace = true
serde_json.workspace = true
# Pinned: must match the wasm-bindgen-cli in flake.nix exactly. build.sh verifies.
wasm-bindgen = "=0.2.121"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
dev-panics = ["dep:console_error_panic_hook"]
